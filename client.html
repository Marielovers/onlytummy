<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile View - Controller</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            /* 부드러운 살색 그라데이션 배경 */
            background: radial-gradient(circle, #f9d8ce 0%, #eab8a6 100%); 
            touch-action: none; 
        }
        #belly-canvas { width: 100vw; height: 100vh; display: block; }
        #status { position: absolute; top: 10px; left: 10px; font-weight: bold; font-family: sans-serif; color: #a46f5c; }
    </style>
</head>
<body>
    <div id="status">PC와 연결 중... 화면을 문질러보세요!</div>
    <canvas id="belly-canvas"></canvas>

    <script>
        // --- [1] PeerJS 연결 설정 (이전과 동일) ---
        const urlParams = new URLSearchParams(window.location.search);
        const hostId = urlParams.get('id');
        const statusText = document.getElementById('status');
        let connection;

        if (hostId) {
            const peer = new Peer();
            peer.on('error', (err) => {
                statusText.innerText = "통신 에러: " + err.type;
                statusText.style.color = "red";
            });
            // ------------------------

            peer.on('open', () => {
                connection = peer.connect(hostId);
                
                connection.on('open', () => {
                    statusText.innerText = "연결 완료! 배꼽을 핥아보세요(문지르기).";
                    statusText.style.color = "green";
                });

                // 연결 실패 또는 끊김 감지
                connection.on('error', (err) => {
                    statusText.innerText = "연결 오류 발생!";
                });
            });
        }

        // --- [2] 캔버스 및 물리 엔진 설정 ---
        const canvas = document.getElementById('belly-canvas');
        const ctx = canvas.getContext('2d');
        let cx = window.innerWidth / 2;
        let cy = window.innerHeight / 2;
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            cx = canvas.width / 2;
            cy = canvas.height / 2;
        });
        window.dispatchEvent(new Event('resize'));

        // 살결 당김(탄성)을 위한 물리 변수
        let currentOffset = { x: 0, y: 0 }; // 현재 배꼽이 밀려난 위치
        let targetOffset = { x: 0, y: 0 };  // 손가락에 의해 당겨지는 목표 위치
        let velocity = { x: 0, y: 0 };      // 움직임 속도
        
        const SPRING = 0.1;    // 탄성 (높을수록 뻣뻣하고 빨리 돌아감)
        const FRICTION = 0.75; // 마찰력 (낮을수록 출렁거림이 오래감)
        const MAX_PULL = 30;   // 살이 늘어나는 최대 픽셀 제한

        let isTouching = false;
        let lastTouchPos = { x: 0, y: 0 };
        let salivaTrails = []; // 침(지나간 흔적) 배열

        // --- [3] 그리기 함수 ---
        // 배꼽 모양을 그리는 함수
        function drawBellyButton(x, y) {
            // 배꼽 외곽 (살짝 파인 느낌)
            ctx.fillStyle = 'rgba(214, 160, 142, 0.6)';
            ctx.beginPath();
            ctx.ellipse(x, y, 20, 35, 0, 0, Math.PI * 2);
            ctx.fill();

            // 배꼽 안쪽 그림자 (깊이감)
            ctx.fillStyle = '#b77d69';
            ctx.beginPath();
            ctx.ellipse(x, y + 5, 8, 15, 0, 0, Math.PI * 2);
            ctx.fill();

            // 배꼽 주름선 (입체감을 위한 곡선)
            ctx.strokeStyle = '#c48b77';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(x - 4, y - 25);
            ctx.quadraticCurveTo(x + 10, y, x - 4, y + 30);
            ctx.stroke();
        }

        // 침(지나간 흔적) 그리기 및 업데이트
        function drawSaliva() {
            for (let i = salivaTrails.length - 1; i >= 0; i--) {
                const trail = salivaTrails[i];
                ctx.fillStyle = `rgba(255, 255, 255, ${trail.alpha})`;
                ctx.beginPath();
                ctx.arc(trail.x, trail.y, trail.radius, 0, Math.PI * 2);
                ctx.fill();

                // 시간이 지남에 따라 투명해지며 사라짐
                trail.alpha -= 0.02;
                if (trail.alpha <= 0) {
                    salivaTrails.splice(i, 1);
                }
            }
        }

        // --- [4] 메인 애니메이션 루프 ---
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 물리 계산 (Hooke's Law: F = -kx)
            let ax = (targetOffset.x - currentOffset.x) * SPRING;
            let ay = (targetOffset.y - currentOffset.y) * SPRING;
            
            velocity.x += ax;
            velocity.y += ay;
            
            // 마찰력 적용
            velocity.x *= FRICTION;
            velocity.y *= FRICTION;
            
            // 위치 업데이트
            currentOffset.x += velocity.x;
            currentOffset.y += velocity.y;

            // 터치 중이 아닐 때는 목표 위치를 중앙(0,0)으로 되돌림
            if (!isTouching) {
                targetOffset.x = 0;
                targetOffset.y = 0;
            }

            // 침 자국 렌더링
            drawSaliva();

            // 최종 배꼽 위치 렌더링
            const bellyX = cx + currentOffset.x;
            const bellyY = cy + currentOffset.y;
            drawBellyButton(bellyX, bellyY);

            requestAnimationFrame(animate);
        }
        animate();

        // --- [5] 터치 이벤트 처리 ---
        canvas.addEventListener('touchstart', (e) => {
            isTouching = true;
            lastTouchPos.x = e.touches[0].clientX;
            lastTouchPos.y = e.touches[0].clientY;
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!isTouching) return;
            
            const currentX = e.touches[0].clientX;
            const currentY = e.touches[0].clientY;
            
            // 이동 거리 (문지른 방향과 강도)
            const dx = currentX - lastTouchPos.x;
            const dy = currentY - lastTouchPos.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            // 배꼽을 문지르는 방향으로 당김 (최대 거리 제한)
            targetOffset.x += dx * 0.5; // 0.5를 곱해 피부가 너무 훅 당겨지지 않게 함
            targetOffset.y += dy * 0.5;
            
            // MAX_PULL을 넘어가지 않도록 좌표 제한
            const pullDist = Math.sqrt(targetOffset.x ** 2 + targetOffset.y ** 2);
            if (pullDist > MAX_PULL) {
                targetOffset.x = (targetOffset.x / pullDist) * MAX_PULL;
                targetOffset.y = (targetOffset.y / pullDist) * MAX_PULL;
            }

            if (distance > 3) { 
                // 시각적 효과: 지나간 자리에 침 자국 추가
                salivaTrails.push({ x: currentX, y: currentY, radius: Math.random() * 10 + 10, alpha: 0.5 });
                
                // PC로 데이터 전송 (연결되어 있을 때만)
                if (connection) {
                    connection.send({
                        action: 'lick',
                        intensity: Math.min(distance / 50, 1.0)
                    });
                }
                
                lastTouchPos.x = currentX;
                lastTouchPos.y = currentY;
            }
        });

        canvas.addEventListener('touchend', () => {
            isTouching = false;
        });
        canvas.addEventListener('touchcancel', () => {
            isTouching = false;
        });
    </script>
</body>
</html>
