<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>PC View - Live2D Host</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <!-- 1. Live2D Core -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    
    <!-- 2. PixiJS 6.5.3버전 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/6.5.3/pixi.min.js"></script>
    
    <!-- 3. pixi-live2d-display -->
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>
    
    <style>
        body { margin: 0; display: flex; background: #222; color: white; font-family: sans-serif; cursor: pointer; }
        #game-container { position: relative; width: 800px; height: 600px; margin: 20px auto; background: #333; }
        #canvas { width: 100%; height: 100%; display: block; }
        #ui-layer { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; }
        #qrcode { margin-top: 10px; background: white; padding: 10px; display: inline-block; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="canvas"></canvas>
        <div id="ui-layer">
            <h2 id="status">⚠️ 화면을 1회 클릭하여 오디오를 켜주세요</h2>
            <div id="qrcode" style="display:none;"></div>
        </div>
    </div>

    <script>
        // 1. Live2D 및 PixiJS 설정
        const canvas = document.getElementById('canvas');
        const app = new PIXI.Application({ 
            view: canvas, 
            width: 800, 
            height: 600, 
            transparent: true
        });
        
        let live2dModel;

        async function loadLive2D() {
            live2dModel = await PIXI.live2d.Live2DModel.from('./assets/SD_onsun.model3.json');
            app.stage.addChild(live2dModel);
            
            live2dModel.x = 400;
            live2dModel.y = 300;
            live2dModel.anchor.set(0.5, 0.5);
            live2dModel.scale.set(0.2); 
        }
        loadLive2D();

        const reactSounds = [
            new Audio('./assets/react1.wav'),
            new Audio('./assets/react2.wav'),
            new Audio('./assets/react3.wav'),
            new Audio('./assets/react4.wav')
        ];

        // [추가됨] 모든 반응 오디오의 기본 피치 보존 기능 끄기
        reactSounds.forEach(sound => {
            sound.preservesPitch = false;
            sound.webkitPreservesPitch = false;
        });

        let lastReactTime = 0;
        let isAudioUnlocked = false;
        
        // 2. PeerJS P2P 통신 설정
        const peer = new Peer(); 
        
        peer.on('error', (err) => {
            console.error('PeerJS 에러 발생:', err.type, err);
            document.getElementById('status').innerText = '에러 발생: ' + err.type;
        });

        peer.on('open', (id) => {
            console.log('My peer ID is: ' + id);
            const currentUrl = window.location.href.replace('host.html', '');
            const clientUrl = `${currentUrl}client.html?id=${id}`;
            
            new QRCode(document.getElementById("qrcode"), {
                text: clientUrl,
                width: 128, height: 128
            });
        });

        window.addEventListener('click', () => {
            if (isAudioUnlocked) return;

            reactSounds.forEach(sound => {
                sound.play().then(() => {
                    sound.pause();
                    sound.currentTime = 0;
                }).catch(e => console.log('오디오 해제 실패:', e));
            });
            
            isAudioUnlocked = true;
            document.getElementById('status').innerText = '연결 대기 중... (오디오 준비 완료)';
            document.getElementById('qrcode').style.display = 'inline-block';
        }, { once: true });

        peer.on('connection', (conn) => {
            document.getElementById('status').innerText = '모바일 기기 연결됨! (터치 반응 대기중)';
            document.getElementById('qrcode').style.display = 'none';

            conn.on('data', (data) => {
                if(data.action === 'lick' && live2dModel) {
                    const now = Date.now();
                    
                    if (now - lastReactTime > 1000) {
                        const randomIndex = Math.floor(Math.random() * reactSounds.length);
                        const selectedSound = reactSounds[randomIndex];
                        
                        // [추가됨] 선택된 소리의 피치(재생 속도)를 0.9 ~ 1.1 사이로 랜덤 세팅
                        selectedSound.playbackRate = 0.9 + (Math.random() * 0.2);

                        selectedSound.currentTime = 0; 
                        selectedSound.play().catch(err => console.log('화면 클릭이 필요합니다.', err));
                        
                        lastReactTime = now;
                        
                        live2dModel.motion('TapBody'); 
                    }
                }
            });
        });
    </script>
</body>
</html>
