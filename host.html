<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>리포 배꼽 핥는 게임</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <!-- Live2D Core & PixiJS 6.5.3 -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script src="https://unpkg.com/pixi.js@6.5.3/dist/browser/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>
    
    <style>
        body { margin: 0; display: flex; background: #222; color: white; font-family: sans-serif; cursor: pointer; overflow: hidden; }
        /* [수정됨] 침대 배경이 적용된 게임 컨테이너 */
        #game-container { 
            position: relative; 
            width: 800px; 
            height: 600px; 
            margin: 20px auto; 
            
            /* 옵션 1: CSS로 만든 푹신한 핑크색 땡땡이 침대보 (기본 적용) */
            background-color: #fff0f5; 
            background-image: radial-gradient(#ffc0cb 3px, transparent 3px);
            background-size: 40px 40px;

            /* 옵션 2: 직접 그린 침대 이미지 파일이 있다면 위 두 줄을 지우고 아래 주석을 푸세요 */
            /* background-image: url('./assets/bed.png'); */
            /* background-size: cover; */
            /* background-position: center; */
            
            /* 침대 매트리스 느낌을 위한 테두리 둥글기 및 그림자 */
            border-radius: 20px; 
            box-shadow: inset 0 0 50px rgba(0,0,0,0.1), 0 20px 50px rgba(0,0,0,0.8);
        }
        #canvas { width: 100%; height: 100%; display: block; }
        #ui-layer { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; }
        #qrcode { margin-top: 10px; background: white; padding: 10px; display: inline-block; }
        
        #game-over-screen {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(200, 0, 0, 0.4); z-index: 20; text-align: center;
            padding-top: 200px; box-sizing: border-box;
        }
        #game-over-screen h1 { font-size: 60px; color: #fff; text-shadow: 0 0 10px red; margin: 0; }
        #game-over-screen p { font-size: 30px; margin-top: 20px; font-weight: bold; }
        #score-display { font-size: 50px; color: #ffd700; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="canvas"></canvas>
        <div id="ui-layer">
            <h2 id="status">⚠️ 화면을 1회 클릭하여 오디오를 켜주세요</h2>
            <div id="qrcode" style="display:none;"></div>
        </div>
        
        <div id="game-over-screen">
            <h1>리포가 잠에서 깼습니다!</h1>
            <p>만진 횟수: <span id="score-display">0</span>회</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const app = new PIXI.Application({ view: canvas, width: 800, height: 600, transparent: true });
        
        let live2dModel;
        // [수정됨] 대소문자 매칭: normal, react, angry
        let currentBase = 'normal'; 
        let twitchAmount = 0; 
        
        let isReacting = false; 

        async function loadLive2D() {
            live2dModel = await PIXI.live2d.Live2DModel.from('./assets/SD_onsun.model3.json', { autoInteract: false });
            app.stage.addChild(live2dModel);
            live2dModel.x = 400; live2dModel.y = 300;
            live2dModel.anchor.set(0.5, 0.5);
            live2dModel.scale.set(0.2); 
            
            // 시선 추적 강제 비활성화
            live2dModel.trackedPointers = [];

            // [추가됨] 1. 엔진의 자동 눈 깜빡임 기능 강제 삭제
            if (live2dModel.internalModel.eyeBlink) {
                live2dModel.internalModel.eyeBlink = null;
            }

            setTimeout(() => {
                if (live2dModel) {
                    live2dModel.expression(currentBase);
                }
            }, 500);

            // 매 프레임 애니메이션 루프
            app.ticker.add(() => {
                if (!live2dModel || !live2dModel.internalModel) return;
                const coreModel = live2dModel.internalModel.coreModel;

                // [추가됨] 2. 수면 상태에 따른 눈/눈썹 강제 고정
                try {
                    if (currentBase === 'normal') {
                        // 자고 있을 때(normal이거나 핥아서 react 중일 때)는 무조건 눈을 꽉 감음
                        coreModel.setParameterValueById('ParamEyeLOpen', 0);
                        coreModel.setParameterValueById('ParamEyeROpen', 0);
                    } else if (currentBase === 'angry') {
                        // 깼을 때(angry)는 무조건 눈을 부릅뜨고 화난 눈썹 유지
                        coreModel.setParameterValueById('ParamEyeLOpen', 1);
                        coreModel.setParameterValueById('ParamEyeROpen', 1);
                        coreModel.setParameterValueById('ParamBrowLForm', -1);
                        coreModel.setParameterValueById('ParamBrowRForm', -1);
                    }
                } catch(e) {}

                // 부드러운 완충(Damping) 움찔 액션
                if (twitchAmount > 0.05) {
                    let time = Date.now() / 200; 
                    let shake = Math.sin(time) * twitchAmount;
                    
                    try {
                        coreModel.setParameterValueById('ParamAngleZ', shake);
                        coreModel.setParameterValueById('ParamBodyAngleZ', shake * 0.3);
                    } catch(e) {}
                    
                    twitchAmount *= 0.92; 
                }
            });
        }
        loadLive2D();

        const reactSounds = [
            new Audio('./assets/react1.wav'), new Audio('./assets/react2.wav'),
            new Audio('./assets/react3.wav'), new Audio('./assets/react4.wav')
        ];
        reactSounds.forEach(sound => { sound.preservesPitch = false; sound.webkitPreservesPitch = false; });

        let isGameOver = false;
        let score = 0;           
        let sleepValue = 100;    
        let lastReactTime = 0;
        let isAudioUnlocked = false;
        let reactTimer;
        
        setInterval(() => {
            if (!isGameOver && sleepValue < 100) {
                sleepValue += 2; 
                if (sleepValue > 100) sleepValue = 100;
            }
        }, 500);

        const peer = new Peer(); 
        
        peer.on('open', (id) => {
            const currentUrl = window.location.href.replace('host.html', '');
            const clientUrl = `${currentUrl}client.html?id=${id}`;
            new QRCode(document.getElementById("qrcode"), { text: clientUrl, width: 128, height: 128 });
        });

        window.addEventListener('click', () => {
            if (isAudioUnlocked) return;
            reactSounds.forEach(sound => {
                sound.play().then(() => { sound.pause(); sound.currentTime = 0; }).catch(e => {});
            });
            isAudioUnlocked = true;
            document.getElementById('status').innerText = '연결 대기 중... (오디오 준비 완료)';
            document.getElementById('qrcode').style.display = 'inline-block';
        }, { once: true });

        peer.on('connection', (conn) => {
            document.getElementById('status').innerText = '모바일 기기 연결됨! (터치 대기중)';
            document.getElementById('qrcode').style.display = 'none';

            conn.on('data', (data) => {
                if(data.action === 'lick' && live2dModel) {
                    const now = Date.now();
                    
                    if (!isGameOver) {
                        score++;
                        sleepValue -= (data.intensity * 8); 

                        let wakeFactor = (100 - sleepValue) / 100; 
                        if (wakeFactor < 0) wakeFactor = 0;
                        twitchAmount = 0.5 + (wakeFactor * 3.0); 

                        if (sleepValue <= 0) {
                            isGameOver = true;
                            currentBase = 'angry';  // [수정됨] 소문자로 매칭
                            isReacting = false; 
                            
                            document.getElementById('game-over-screen').style.display = 'block';
                            document.getElementById('score-display').innerText = score;
                            conn.send({ action: 'gameover', finalScore: score });
                            
                            reactSounds[0].play().catch(e=>{}); 
                            live2dModel.expression('angry'); // [수정됨] 소문자로 매칭
                            return; 
                        }
                    }

                    if (!isReacting) {
                        isReacting = true;
                        live2dModel.expression('react'); // [수정됨] 소문자로 매칭
                    }
                    
                    clearTimeout(reactTimer);
                    reactTimer = setTimeout(() => {
                        isReacting = false;
                        live2dModel.expression(currentBase);
                    }, 1500);
                    
                    if (now - lastReactTime > 1000) {
                        const randomIndex = Math.floor(Math.random() * reactSounds.length);
                        const selectedSound = reactSounds[randomIndex];
                        selectedSound.playbackRate = 0.9 + (Math.random() * 0.2);
                        selectedSound.currentTime = 0; 
                        selectedSound.play().catch(e => {});
                        lastReactTime = now;
                    }
                }
            });
        });
    </script>
</body>
</html>
